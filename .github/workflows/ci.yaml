name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license:
    name: License
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Header and dependency-license checks. The action lives in the apache/*
      # namespace, so it needs no SHA pin under the ASF Actions policy should
      # this project ever be donated.
      - name: Check license headers
        uses: apache/skywalking-eyes/header@v0.9.0
      - name: Check dependency licenses
        uses: apache/skywalking-eyes/dependency@v0.9.0

  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: make vet
      - name: Build
        run: make build
      # `make test` covers ./... including the end-to-end adapter suite under
      # tests/. It is split out here so a failure names which layer broke.
      - name: Unit tests
        run: go test -race -count=1 ./pkg/... ./internal/...

      - name: End-to-end adapter tests
        run: go test -race -count=1 ./tests/...

      - name: Full suite
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Lint
        run: make lint

  # Single fan-in job so branch protection needs only one required check.
  result:
    name: Required
    if: always()
    needs: [license, build, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: echo "all required checks passed"
